name: Vidéos d'exercices

# Télécharge une vidéo de démonstration par exercice depuis Pexels, les
# compresse pour mobile, régénère lib/exercises/exercise-media.ts et
# commit tout directement sur la branche — aucune étape locale nécessaire.
#
# Prérequis unique : un secret de dépôt nommé PEXELS_API_KEY (Settings →
# Secrets and variables → Actions → New repository secret). Aucune autre
# configuration n'est nécessaire ; ce workflow se déclenche manuellement
# depuis l'onglet "Actions" de GitHub (bouton "Run workflow"), ou via un
# déclenchement programmatique.

on:
  workflow_dispatch:
    inputs:
      slugs:
        description: "Slugs à traiter, séparés par des espaces (vide = tous les exercices manquants)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  fetch-videos:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installe ffmpeg
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg
          ffmpeg -version

      - name: Télécharge les vidéos (Pexels)
        working-directory: scripts/videos
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: node fetch-pexels.mjs ${{ inputs.slugs }}

      - name: Recadre/compresse pour mobile
        working-directory: scripts/videos
        env:
          SRC_DIR: sources
          OUT_DIR: ../../public/exercises
        run: bash prepare-videos.sh

      - name: Régénère exercise-media.ts
        run: node scripts/videos/wire-videos.mjs

      - name: Commit + push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/exercises lib/exercises/exercise-media.ts scripts/videos/credits.csv
          if git diff --cached --quiet; then
            echo "Rien de nouveau à commiter."
          else
            git commit -m "Ajoute des vidéos de démonstration d'exercices (Pexels)"
            git push origin HEAD:${{ github.ref_name }}
          fi
